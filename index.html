<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepali Fighter - Prototype</title>
    <style>
        body { margin: 0; padding: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        canvas { border: 4px solid #ffcc00; border-radius: 8px; }
    </style>
    <!-- Load Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 400,
            backgroundColor: '#87CEEB', // Sky blue background
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 800 }, debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player, enemy, cursors, attackKey;
        let playerHealth = 100, enemyHealth = 100;
        let healthText;

        function preload() {
            // We will use simple colored rectangles for now until you add real art
            this.load.image('ground', 'https://labs.phaser.io/assets/sprites/platform.png');
        }

        function create() {
            // 1. Create Ground
            const ground = this.physics.add.staticGroup();
            ground.create(400, 380, 'ground').setScale(2).refreshBody();

            // 2. Create Player (Blue Box)
            player = this.physics.add.sprite(100, 300, 'ground'); // Using platform as placeholder
            player.setTint(0x0000ff); // Blue
            player.setCollideWorldBounds(true);

            // 3. Create Enemy (Red Box)
            enemy = this.physics.add.sprite(700, 300, 'ground');
            enemy.setTint(0xff0000); // Red
            enemy.setCollideWorldBounds(true);

            // 4. Physics Collisions
            this.physics.add.collider(player, ground);
            this.physics.add.collider(enemy, ground);

            // 5. Controls
            cursors = this.input.keyboard.createCursorKeys();
            attackKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

            // 6. UI Text
            healthText = this.add.text(16, 16, 'Player HP: 100 | Enemy HP: 100\nControls: Arrows to Move, SPACE to Attack', { 
                fontSize: '18px', fill: '#000', backgroundColor: '#ffffffaa', padding: { x: 10, y: 5 } 
            });
        }

        function update() {
            // Player Movement
            player.setVelocityX(0);
            if (cursors.left.isDown) {
                player.setVelocityX(-200);
                player.flipX = true;
            } else if (cursors.right.isDown) {
                player.setVelocityX(200);
                player.flipX = false;
            }

            // Jump
            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-400);
            }

            // Attack Logic
            if (Phaser.Input.Keyboard.JustDown(attackKey)) {
                // Check distance to enemy
                const distance = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
                if (distance < 100) {
                    enemyHealth -= 10;
                    // Knockback effect
                    enemy.setVelocityX(player.flipX ? 200 : -200);
                    enemy.setTint(0xffffff); // Flash white
                    this.time.delayedCall(100, () => enemy.setTint(0xff0000));
                }
            }

            // Keep enemy on ground after knockback
            if (enemy.body.touching.down) {
                enemy.setVelocityX(0);
            }

            // Update UI
            healthText.setText(`Player HP: ${playerHealth} | Enemy HP: ${enemyHealth}\nControls: Arrows to Move, SPACE to Attack`);

            if (enemyHealth <= 0) {
                healthText.setText('YOU WIN! Refresh to play again.');
                enemy.setVisible(false);
                enemy.body.enable = false;
            }
        }
    </script>
</body>
</html>
